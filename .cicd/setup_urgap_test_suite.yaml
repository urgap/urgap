steps:
  - template: misc/checkout_package.yaml@templates
    parameters:
      package: urgap
  - template: misc/setup_python.yaml@templates
    parameters:
      PYTHON_VERSION: $(pythonVersion)
  - script: |
      pip install uv hatch versioningit
    displayName: Install uv
  - script: |
      hatch build -t wheel
      uctl info version
      uctl info unodes
    displayName: Setup urgap
    env:
      URGAP_HOME: $(Pipeline.Workspace)/.urgap