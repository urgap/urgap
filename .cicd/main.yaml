trigger:
  branches:
    include:
      - main
      - dev
      - feature/*
      - fix/*
pr:
  drafts: false
  branches:
    include:
      - main
      - feature/*
      - fix/*
resources:
  repositories:
    - repository: templates
      type: github
      name: gsk-tech/dso_azure_pipeline_templates
      ref: main
      endpoint: DSO-R1-Github
pool:
  vmImage: ubuntu-latest
stages:
  - stage: CodeQuality
    jobs:
      - job: Ruff
        steps:
  - stage: Tests
    dependsOn: CodeQuality
    jobs:
      - job: Tests
        strategy:
          matrix:
            Python3.11:
            Python3.12:
        steps:
          - template: tests/setup_tests.yaml@templates
          - template: tests/tests.yaml@templates
            parameters:
              testFolder: tests/unittests
              testCategory: Unittests
          - template: tests/tests.yaml@templates
            parameters:
              testFolder: tests/integrationtests
              testCategory: Integrationtests
          - template: tests/coverage_report.yaml@templates
            parameters:
              coverageType: 'xml'
          - template: code_quality/sonarqube.yaml@templates
            parameters: