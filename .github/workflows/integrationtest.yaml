name: Run tests
on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install pytest
          uv pip install .["all"]
      - name: Run unit tests
        run: |
          pytest tests/unittests
      - name: Run integration tests
        run: |
          pytest tests/integrationtests
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install pytest
          uv pip install .["all"]
      - name: Run unit tests
        run: |
          pytest tests/unittests
      - name: Run integration tests
        run: |
          pytest tests/integrationtests
