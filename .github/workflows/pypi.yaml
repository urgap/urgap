name: Push to Pypi
on:
  push:
    tags:
      - v*
jobs:
  pypi-publish:
      name: Upload release to PyPI
      runs-on: ubuntu-latest
      environment:
        name: pypi
        url: https://pypi.org/p/urgap
      steps:
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PROD_PYPI }}
