[dev-dependencies]
black = { version = "^18.3-alpha.0", python = "^3.10" }

[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[project]
readme = "README.rst"
dynamic = ["version"]
classifiers = [
    'Development Status :: 4 - Beta',
    'Environment :: Console',
    'Intended Audience :: Developers',
    'Intended Audience :: Education',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: MIT License',
    'Operating System :: MacOS :: MacOS X',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: POSIX :: SunOS/Solaris',
    'Operating System :: Unix',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
    'Topic :: Scientific/Engineering :: Chemistry',
]
dependencies = [
    'flask-wtf==1.2.2',
    'Jinja2==3.1.6',
    'nbformat>=4.2.0',
    'openpyxl',
    'packaging==25.0',
    'pandas>=1.4.2,<2.4.0',
    'plotly',
    'requests>=2.26,<2.33',
    'tqdm==4.67.1',
]

[project.optional-dependencies]
cloud = [
    'cloud-sql-python-connector~=1.0',
    'pg8000~=1.29',
]
databases = [
    'pymongo>=3.8.0,<5.0.0',
    'psycopg2-binary'
]
docs = [
    'sphinx',
    'sphinx-rtd-theme',
]
legacy = [
    'unimod-mapper~=0.6.4',
    'uparma~=1.0.1',
    'chemical-composition~=1.0.6',
    'FlowKit',
]

all = [
    'cloud-sql-python-connector~=1.0',
    'pg8000~=1.29',
    'psycopg2-binary',
    'pymongo>=3.8.0,<5.0.0',
]

[project.scripts]

[tool.setuptools.packages.find]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"*" = ["*.txt"]

[tool.hatch.version]
source = "versioningit"

[tool.versioningit]
default-version = "0.0.0+unknown"

[tool.versioningit.next-version]
method = "smallest"

[tool.versioningit.format]
distance = "{next_version}.dev{distance}"
dirty = "{next_version}.dev{distance}"
distance-dirty = "{next_version}.dev{distance}"

[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4
exclude = [
    ".git",
    "build",
    "dist",
    "docs"
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "S", # Flake8 Bandit
    "E501", # Line too long
    "PLR2004", # Magic value comparison
    "RUF012", # Mutable class default
    "LOG015", # Root logger call
    "FBT001", # Boolean type hint positional argument
    "FBT002", # Boolean default value positional argument,
    "PYI034", # Wait until we drop 3.10 so Self is in typing
    "PLR0913", # Too many arguments -> TODO
    "TC003", # Causes false positives
    "D203", # Incompatible with D211
    "D213", # Incompatible with D212
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true
lines-between-types = 1